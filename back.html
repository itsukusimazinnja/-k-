<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>黒羽録 - 隠されたページ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #8b0000;
      font-family: "serif", "Hiragino Mincho ProN", "Yu Mincho", "MS PMincho", serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
    }

    /* 最上部：タイトル画像領域 */
    .header-image-container {
      width: 100%;
      margin-bottom: 50px;
      text-align: center;
    }

    .header-image-container img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      object-fit: contain;
    }

    /* 文章エリア */
    .text-section {
      width: 100%;
      font-size: 1.5rem;
      letter-spacing: 0.15em;
      line-height: 2;
      margin-bottom: 60px;
      color: #7a0000;
      text-shadow: 0 0 3px #300000;
    }

    .line-left {
      text-align: left;
    }

    .line-right {
      text-align: right;
    }

    /* 画像ギャラリー（シンプルに縦に貼るだけ） */
    .gallery {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    /* トリミングせず全貌を表示するためのスタイル */
    .gallery img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 最上部：タイトル画像 -->
    <div class="header-image-container" id="header-container">
      <img src="IMG_2979.jpeg" alt="IMG_2979">
    </div>

    <!-- 文章部分 -->
    <div class="text-section">
      <div class="line-left">凋落の森へよおこそ。</div>
      <div class="line-right">宿痾の河でごゆっくり</div>
    </div>

    <!-- 写真をそのまま並べるエリア（残りの3枚） -->
    <div class="gallery" id="gallery">
      <img src="IMG_2975.jpeg" alt="IMG_2975">
      <img src="IMG_2976.jpeg" alt="IMG_2976">
      <img src="IMG_2978.jpeg" alt="IMG_2978">
    </div>
  </div>

</body>
</html>
